name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Portal adapter integration tests
        run: node tools/test-nctu-sync.mjs
      - name: Unit tests, lint and APK builds
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Upload APKs and test reports
        uses: actions/upload-artifact@v4
        with:
          name: LTM-Campus-0.3.0-build
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 30
